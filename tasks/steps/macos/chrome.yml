---
# macOS counterpart of tasks/steps/debian/chrome.yml.
# Google publishes a universal macOS Chrome .dmg at a stable URL — mount it,
# copy the .app into /Applications, unmount. No brew needed.

- name: Check whether Google Chrome is already installed
  stat:
    path: /Applications/Google Chrome.app
  register: chrome_app

- name: Install Chrome
  when: not chrome_app.stat.exists
  block:
    - name: Download the Google Chrome dmg (universal)
      get_url:
        url: https://dl.google.com/chrome/mac/universal/stable/GGRO/googlechrome.dmg
        dest: /tmp/googlechrome.dmg
        mode: '0644'
      register: chrome_download
      retries: 3
      delay: 5
      until: chrome_download is succeeded

    - name: Mount the dmg and copy Google Chrome.app into /Applications
      block:
        - name: Mount googlechrome.dmg
          command: hdiutil attach /tmp/googlechrome.dmg -nobrowse -mountpoint /Volumes/ChromeInstaller

        - name: Copy Google Chrome.app into /Applications
          command: cp -R "/Volumes/ChromeInstaller/Google Chrome.app" /Applications/
      always:
        - name: Unmount googlechrome.dmg
          command: hdiutil detach /Volumes/ChromeInstaller
          failed_when: false
...
