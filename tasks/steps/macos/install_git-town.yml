---
# macOS counterpart of tasks/steps/install_git-town.yml.
# Same GitHub-release flow, but the macOS tarball (intel_64 / arm_64) holds a
# plain binary — no .deb to unpack. Installed into ~/.local/bin (already on
# PATH via .zprofile), so no sudo is needed.

- name: Get latest git-town release info
  uri:
    url: https://api.github.com/repos/git-town/git-town/releases/latest
    return_content: yes
  register: git_town_release
  retries: 3
  delay: 5
  until: git_town_release is succeeded

- name: Set git-town architecture suffix
  set_fact:
    git_town_arch: "{{ 'intel_64' if ansible_architecture == 'x86_64' else 'arm_64' }}"

- name: Download git-town macOS tarball
  get_url:
    url: "https://github.com/git-town/git-town/releases/download/{{ git_town_release.json.tag_name }}/git-town_macos_{{ git_town_arch }}.tar.gz"
    dest: "/tmp/git-town_macos_{{ git_town_arch }}.tar.gz"
    mode: '0644'
  register: git_town_download
  retries: 3
  delay: 5
  until: git_town_download is succeeded

- name: Ensure a dedicated unpack directory exists
  file:
    path: /tmp/git-town_extract
    state: directory

# unarchive refuses .tar.gz without GNU tar, and macOS only ships bsd tar, so
# unpack with tar itself.
- name: Unpack git-town
  command: "tar -xzf /tmp/git-town_macos_{{ git_town_arch }}.tar.gz -C /tmp/git-town_extract"
  args:
    creates: /tmp/git-town_extract/git-town

- name: Install the git-town binary
  copy:
    src: /tmp/git-town_extract/git-town
    dest: ~/.local/bin/git-town
    mode: '0755'
    remote_src: yes
...
