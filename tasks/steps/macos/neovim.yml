---
# macOS counterpart of tasks/steps/debian/neovim.yml.
# Same pinned release, macOS asset names (nvim-macos-arm64 / nvim-macos-x86_64).
# Unpacked under ~/.local with the binary symlinked into ~/.local/bin (already
# on PATH via .zprofile), so no sudo is needed.

- name: Set the Neovim macOS asset name
  set_fact:
    nvim_asset: "{{ 'nvim-macos-x86_64' if ansible_architecture == 'x86_64' else 'nvim-macos-arm64' }}"

- name: Ensure ~/.local exists
  file:
    path: ~/.local
    state: directory

- name: Download Neovim
  get_url:
    url: "https://github.com/neovim/neovim/releases/download/v0.12.1/{{ nvim_asset }}.tar.gz"
    dest: "/tmp/{{ nvim_asset }}.tar.gz"
    mode: '0644'
  register: nvim_download
  retries: 3
  delay: 5
  until: nvim_download is succeeded

# unarchive refuses .tar.gz without GNU tar, and macOS only ships bsd tar, so
# unpack with tar itself.
- name: Unpack Neovim
  command: "tar -xzf /tmp/{{ nvim_asset }}.tar.gz -C {{ ansible_env.HOME }}/.local"
  args:
    creates: "{{ ansible_env.HOME }}/.local/{{ nvim_asset }}/bin/nvim"

- name: Symlink nvim into ~/.local/bin
  file:
    src: "{{ ansible_env.HOME }}/.local/{{ nvim_asset }}/bin/nvim"
    dest: ~/.local/bin/nvim
    state: link

- name: Add nvim bin to PATH
  lineinfile:
    path: ~/.zshrc
    line: 'export PATH="$PATH:{{ ansible_env.HOME }}/.local/{{ nvim_asset }}/bin"'
    create: yes
...
