#     INSTALL_PATH: "{{ ansible_env.HOME }}/.local/bin"

# - name: Add Starship init to .zshrc
#   lineinfile:
#     path: ~/.zshrc
#     line: 'eval "$(starship init zsh)"'
#     create: yes

- name: Set EDITOR in .zshrc
  lineinfile:
    path: ~/.zshrc
    line: export EDITOR=nvim
    create: yes
...
