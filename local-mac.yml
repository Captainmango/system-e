- name: Set up a macOS machine (local)
  hosts: localhost
  vars:
    arch_mapping: # For the Docker Desktop download so arch is right
      x86_64: amd64
      arm64: arm64
    # Skip the heavy GUI apps (WezTerm, Docker Desktop, VSCode, Obsidian,
    # Chrome) for a fast smoke test. bin/test-macos.sh sets this to true on
    # the Intel test VM.
    minimal_install: false
  tasks:
    - name: Steps
      include_tasks:
        file: tasks/macos.yml
